name: CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=docker.io/anirudh09041/myapp
          TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:$TAG ./app

      - name: Push Docker image
        run: |
          IMAGE_NAME=docker.io/anirudh09041/myapp
          TAG=${{ github.sha }}
          docker push $IMAGE_NAME:$TAG

      - name: Update values.yaml with new image tag
        run: |
          sed -i "s/tag:.*/tag: \"${{ github.sha }}\"/" charts/myapp/values.yaml

      - name: Commit updated values.yaml
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update image tag to ${{ github.sha }}"
          file_pattern: charts/myapp/values.yaml

      - name: Package Helm chart
        run: |
          helm package charts/myapp --destination ./chart-packages
