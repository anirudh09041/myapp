name: CI Pipeline

permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=docker.io/anirudh09041/myapp
          TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:$TAG ./app

      - name: Push Docker image
        run: |
          IMAGE_NAME=docker.io/anirudh09041/myapp
          TAG=${{ github.sha }}
          docker push $IMAGE_NAME:$TAG

      - name: Update values.yaml with new image tag
        run: |
          sed -i "s/tag:.*/tag: \"${{ github.sha }}\"/" charts/myapp/values.yaml

      - name: Commit updated values.yaml
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add charts/myapp/values.yaml
          git commit -m "Update image tag to ${GITHUB_SHA}" || echo "No changes to commit"

      - name: Push changes using PAT
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git push https://${PAT_TOKEN}@github.com/${{ github.repository }} HEAD:${{ github.ref }}

      - name: Package Helm chart
        run: |
          helm package charts/myapp --destination ./chart-packages
